<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100px;
            border-collapse: collapse;
            border: 1px solid black;
        }
        th {
            text-align: start;
            padding-left: 10px;
        }
        .first {
            background-color: rgb(206, 73, 73);
        }
        .second {
            background-color: rgb(36, 140, 36);
        }

        @media (max-width: 640px) {
            .first {
                background-color: blanchedalmond;
            }
            .second {
                background-color: rgb(101, 231, 231);
            }
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th class="first">First cell</th>
            <th class="second">Second cell</th>
        </tr>
    </table>
</body>
</html>
